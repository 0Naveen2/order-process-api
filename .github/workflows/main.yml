name: PAPI CI

on:
  push:
    branches:
      - development

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: maven

      - name: Setup Maven 3.9.9
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build Application
        run: mvn clean compile -DskipMunitTests -s .maven/settings.xml
        env:
          CONNECTED_APP_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          CONNECTED_APP_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}

      - name: Run MUnit Tests
        run: mvn test -s .maven/settings.xml
        env:
          CONNECTED_APP_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          CONNECTED_APP_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}

      - name: Package Application
        run: mvn package -DskipMunitTests -s .maven/settings.xml
        env:
          CONNECTED_APP_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          CONNECTED_APP_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}

      - name: Deploy to CloudHub 2.0
        run: |
          mvn deploy -DskipMunitTests -DmuleDeploy -s .maven/settings.xml \
            -Danypoint.orgId="${{ vars.ANYPOINT_ORG_ID }}" \
            -Danypoint.environment="${{ vars.ANYPOINT_ENVIRONMENT }}" \
            -Danypoint.target="${{ vars.CLOUDHUB_TARGET }}" \
            -Danypoint.appName="${{ vars.APPLICATION_NAME }}" \
            -DmuleVersion="${{ vars.MULE_VERSION }}" \
            -Dsecure.key="${{ secrets.SECURE_KEY }}"
        env:
          CONNECTED_APP_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          CONNECTED_APP_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
          SECURE_KEY: ${{ secrets.SECURE_KEY }}

